# Added to verify independently resolved public worker dependencies.
name: Locked public worker dependencies
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Test the locked official dependency graph
        run: cargo +1.97.1 test --locked --all-targets
